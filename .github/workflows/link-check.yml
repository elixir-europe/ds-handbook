name: Link checks

on:
  pull_request:
  schedule:
    # Monday 06:17 UTC. Off the top of the hour to reduce scheduler congestion.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      lane:
        description: Checks to run
        required: true
        default: both
        type: choice
        options:
          - both
          - internal
          - external
      publish_report:
        description: Publish a test report issue on this fork
        required: false
        default: false
        type: boolean

# Grant each job only the permissions it needs.
permissions: {}

concurrency:
  group: link-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  internal:
    name: Internal links and anchors
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.lane == 'internal' || inputs.lane == 'both'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      # The explicit empty value prevents jekyll-github-metadata from injecting
      # the Pages base URL, so root-relative links resolve directly inside _site.
      - name: Build the site
        run: bundle exec jekyll build --baseurl ""
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production
          JEKYLL_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}

      # This blocking lane makes no network requests. Missing pages, assets and
      # anchors are deterministic defects, so they should fail the pull request.
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --offline
            --scheme file
            --root-dir "${{ github.workspace }}/_site"
            --fallback-extensions html
            --index-files index.html
            --include-fragments=anchor-only
            --extensions html
            '_site/**/*.html'
          fail: true
          failIfEmpty: true
          jobSummary: true
          lycheeVersion: v0.24.2
          token: ""

  external:
    name: External link health
    if: >-
      (github.event_name == 'schedule' &&
       github.repository == 'elixir-europe/ds-handbook') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.lane == 'external' || inputs.lane == 'both'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      exit-code: ${{ steps.lychee.outputs.exit_code }}

    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore link cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: >-
            lychee-${{ runner.os }}-${{
            hashFiles('lychee.toml') }}-${{ github.run_id }}
          restore-keys: |
            lychee-${{ runner.os }}-${{ hashFiles('lychee.toml') }}-

      # Scan authored sources rather than generated theme links. This retains
      # genuine GitHub links without hundreds of edit/history/avatar requests.
      - name: Check authored external links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --cache
            --root-dir "${{ github.workspace }}"
            --scheme http
            --scheme https
            --include-fragments=none
            --extensions md,yml,yaml
            README.md
            './pages/**/*.md'
            './_data/**/*.yml'
            './_data/**/*.yaml'
          fail: false
          failIfEmpty: true
          jobSummary: true
          lycheeVersion: v0.24.2
          token: ${{ github.token }}

      - name: Stage report artifact
        id: report
        if: always()
        shell: bash
        env:
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          mkdir -p link-report
          # Only exit codes 0 (clean) and 2 (broken links found) mean Lychee
          # actually ran and produced a trustworthy report. Any other code
          # (config error, crash, etc.) must be treated as a malfunction even
          # if a report file happens to exist.
          if [[ "$LYCHEE_EXIT_CODE" == "0" || "$LYCHEE_EXIT_CODE" == "2" ]] && [[ -s lychee/out.md ]]; then
            cp lychee/out.md link-report/report.md
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' \
              '# External link checker malfunction' \
              '' \
              "Lychee exited with code ${LYCHEE_EXIT_CODE:-unknown} and did not produce a valid report." \
              > link-report/report.md
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-link-report
          path: link-report/report.md
          retention-days: 30

      # Broken links remain advisory, but a missing report means the checker
      # itself malfunctioned and must turn the workflow red.
      - name: Fail on checker malfunction
        if: always() && steps.report.outputs.available != 'true'
        run: exit 1

  publish-report:
    name: Update report issue
    needs: external
    if: >-
      always() &&
      needs.external.result == 'success' &&
      ((github.repository == 'elixir-europe/ds-handbook' &&
        github.ref_name == github.event.repository.default_branch) ||
       (github.event_name == 'workflow_dispatch' &&
        github.repository != 'elixir-europe/ds-handbook' &&
        github.event.inputs.publish_report == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Download report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: external-link-report
          path: link-report

      - name: Create, update or close the report issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          LINK_EXIT_CODE: ${{ needs.external.outputs.exit-code }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const canonical = `${owner}/${repo}` === "elixir-europe/ds-handbook";
            const marker = canonical
              ? "<!-- ds-handbook-link-check-report -->"
              : "<!-- ds-handbook-link-check-report-test -->";
            const title = canonical
              ? "Link Checker Report"
              : "Link Checker Report (test)";
            const scope = canonical ? "canonical" : "fork sandbox";
            const broken = process.env.LINK_EXIT_CODE !== "0";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const raw = fs.readFileSync("link-report/report.md", "utf8");
            const body = [
              marker,
              "",
              broken
                ? `The latest ${scope} check found external-link failures.`
                : `The latest ${scope} check completed without external-link failures.`,
              "",
              `Run: ${runUrl}`,
              "",
              raw
            ].join("\n").slice(0, 60000);

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "all", per_page: 100 }
            );
            const existing = issues.find(
              issue => !issue.pull_request &&
                (issue.body?.includes(marker) || issue.title === title)
            );

            if (!existing && !broken) {
              core.info("No open report is needed.");
              return;
            }

            if (!existing) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["bug"]
              });
              return;
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              title,
              body,
              state: broken ? "open" : "closed",
              ...(broken ? {} : { state_reason: "completed" })
            });
